name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv pip install --system ruff mypy
      - name: ruff check
        working-directory: backend
        run: ruff check .
      - name: mypy
        working-directory: backend
        run: mypy app --ignore-missing-imports

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: careerpilot
          POSTGRES_DB: careerpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://careerpilot:careerpilot@localhost:5432/careerpilot
      TEST_DATABASE_URL: postgresql://careerpilot:careerpilot@localhost:5432/careerpilot_test
      JWT_SECRET: ci-test-secret-key
      GEMINI_API_KEY: dummy-key-for-ci
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - name: Install dependencies
        working-directory: backend
        # torch 先從官方 CPU index 單獨裝（避免 CUDA 版 ~2GB，也避免該 index
        # 的舊版 requests/urllib3/certifi 汙染解析——見 phase6_notes 問題 3）。
        run: |
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -e ".[dev,eval]"
      - name: Create test database
        run: >-
          PGPASSWORD=careerpilot psql -h localhost -U careerpilot -d postgres
          -c 'CREATE DATABASE careerpilot_test'
      - name: Run Alembic migrations (against the test database)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://careerpilot:careerpilot@localhost:5432/careerpilot_test
        run: alembic upgrade head
      - name: Run tests
        working-directory: backend
        # coverage 門檻 80（Phase 9；實測 ~96%，緩衝足）
        run: pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=80
      # Phase 8 eval 單元測試（純函式 + dataset schema 驗證；不打 API、不碰 DB）
      - name: Run eval unit tests
        run: python -m pytest eval/tests -q

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 掃整段 git 歷史，不只本次 diff
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript check
        working-directory: frontend
        run: npm run typecheck

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Run tests
        working-directory: frontend
        run: npm test
