[project]
name = "careerpilot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "google-generativeai>=0.7.0",
    "tenacity>=8.3.0",
    "httpx>=0.27.0",
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    "langsmith>=0.3.45",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

# torch CPU-only：不用 extra-index-url——PyTorch index 同時掛著 2022 年的
# requests/urllib3/certifi，uv 的 first-index 策略會把它們靜默釘舊（帶 CVE）。
# 改為 Dockerfile 與 CI 各自先跑
# `uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu`
# 再從 PyPI 裝其餘依賴（見 phase6_notes 問題 3）。macOS 本地無 CUDA wheel，直接裝即可。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body", "fastapi.Path", "fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
