# Production nginx：靜態檔服務 + /api 反向代理（Phase 10）。
server {
    listen 8080;

    # nginx 預設 body 上限 1MB；履歷上傳限制 10MB（MAX_UPLOAD_SIZE_MB）+ 餘裕
    client_max_body_size 15m;

    # /api/... → backend（compose service DNS）。proxy_pass 結尾的 / 讓 nginx
    # 把 location 匹配到的 /api/ 置換成 /：/api/auth/login → /auth/login，
    # 後端路由完全不需要知道 /api 前綴的存在。
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # application kit 生成為長任務（可達 90s+），與 gunicorn --timeout 對齊
        proxy_read_timeout 300s;
    }

    # Vite 產出的 /assets/*-<hash>.* 內容定址（改內容即換檔名），可永久快取。
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback：/jobs/123 這類前端路由在磁碟上沒有對應檔案，
    # 一律回 index.html 讓 React Router 接手（否則直接刷新會 404）。
    # no-cache（可存但每次 revalidate）：不設的話瀏覽器對 index.html 走
    # heuristic caching，redeploy 後拿舊 HTML 引用已不存在的舊 bundle → 白畫面。
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
